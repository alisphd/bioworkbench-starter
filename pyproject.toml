[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-workbench-starter"
version = "0.1.0"
description = "Modular bioinformatics workbench with desktop and web-demo entrypoints."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Codex Starter" }
]
dependencies = []

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8"
]
web = [
  "streamlit>=1.44"
]
dev = [
  "pytest>=8.3"
]

[project.scripts]
bioworkbench = "bioworkbench.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
